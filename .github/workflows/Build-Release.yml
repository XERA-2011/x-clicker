name: Build-Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write xclicker secrets info
        run: |
          echo ${{ secrets.XCLICKER_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/xclicker.jks
          echo XCLICKER_STORE_FILE='${{ github.workspace }}/xclicker.jks' >> gradle.properties
          echo XCLICKER_STORE_PASSWORD='${{ secrets.XCLICKER_STORE_PASSWORD }}' >> gradle.properties
          echo XCLICKER_KEY_ALIAS='${{ secrets.XCLICKER_KEY_ALIAS }}' >> gradle.properties
          echo XCLICKER_KEY_PASSWORD='${{ secrets.XCLICKER_KEY_PASSWORD }}' >> gradle.properties

      - run: chmod 777 ./gradlew
      - run: ./gradlew app:assembleXclickerRelease

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/xclicker/release

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: app/build/outputs

      - uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  release:
    needs: build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: CHANGELOG.md

      - run: ls -R

      - id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/app-xclicker-release.apk
          asset_name: xclicker-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

      - run: zip -r outputs.zip outputs
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: outputs.zip
          asset_name: outputs-${{ github.ref_name }}.zip
          asset_content_type: application/zip
